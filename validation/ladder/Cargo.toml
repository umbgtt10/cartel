# The testing ladder's tiers that are scenarios rather than mirrors of a source
# file -- conformance, the exhaustive matrix, property and replay -- in a
# package of their own, so stern's paired-test-file stands down here. It tests
# the crate from outside, as a consumer would, and the coverage gate measures
# the library's lines over these tests as well as its own.
[package]
name = "cartel-ladder"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]

[dev-dependencies]
cartel.workspace = true
cartel-core-validation.workspace = true
cartel-spec-model.workspace = true
boon.workspace = true
proptest.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
