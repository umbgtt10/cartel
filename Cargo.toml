# A virtual workspace laid out by role (docs/ADRs/P2-ADR-WorkspaceLaidOutByRole.md):
# the library under crates/, everything that checks it under validation/, the
# gates in xtask/. A crate at the root would put xtask/tests/** inside its
# package directory, and stern would read them as the crate's.
[workspace]
members = [
    "crates/core",
    "crates/spec-model",
    "validation/core-validation",
    "validation/ladder",
    "validation/memory",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

# What validates a change, for cargo-ripe4rust (`just ripe`): the commands it
# runs, in this order, to judge an upgrade ripe rather than asked about.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]

[workspace.dependencies]
cartel = { path = "crates/core" }
cartel-core-validation = { path = "validation/core-validation" }
cartel-spec-model = { path = "crates/spec-model" }
boon = "0.6"
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The gates, taken by xtask from serge4rust, the house's quality gates as a
# library, from crates.io.
serge4rust = "0.2"
sha2 = "0.10"
