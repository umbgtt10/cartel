# An independent model of cartel's specification, as beggar's and faction's
# are: written from the prose and the decision table alone, depending on
# nothing of cartel -- deny.toml refuses it the crate -- and meeting the crate
# only in the specification's encoding, in the ladder. Never published.
[package]
name = "cartel-spec-model"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "An independent model of cartel's specification: its decision table read and interpreted, in the specification's own encoding."
publish = false
autotests = false

[dependencies]
serde_json.workspace = true

[lib]
name = "cartel_spec_model"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
